<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101827"><title>The Silent Conductor — Soundboard</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0%,#26334c,#0c1220 70%);color:#f4efe5;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column}header{text-align:center;padding:12px 8px 8px}h1{font-family:Georgia,serif;font-size:clamp(25px,4vw,43px);margin:0;color:#f3d9a4;letter-spacing:.03em}p{margin:6px 0 0;color:#bbc7d9;font-size:clamp(13px,1.7vw,18px)}main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(130px,1fr));gap:14px;padding:12px 0 16px}.pad{border:2px solid var(--edge);border-radius:22px;background:linear-gradient(155deg,var(--top),var(--bottom));color:white;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;touch-action:none;-webkit-user-select:none;user-select:none;cursor:pointer;box-shadow:0 8px 20px #0006,inset 0 1px 0 #ffffff22;transition:transform .08s,filter .08s;outline-offset:3px}.pad:active,.pad.active{transform:scale(.976);filter:brightness(1.3);box-shadow:0 0 0 4px #ffffff35,inset 0 0 30px #ffffff22}.symbol{font-size:clamp(36px,7vw,80px);line-height:1;font-weight:650}.name{font-size:clamp(22px,3.6vw,39px);font-weight:750}.hint{font-size:clamp(12px,1.5vw,17px);color:#f4f4f4cc}.drum{--edge:#db9465;--top:#75442e;--bottom:#422519}.harp{--edge:#e6c76b;--top:#76602c;--bottom:#423313}.violin{--edge:#ae95e9;--top:#514078;--bottom:#2a2146}.flute{--edge:#81d5d0;--top:#246a73;--bottom:#173d49}footer{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:0 0 12px;color:#cbd5e1;font-size:14px}.toggle{border:1px solid #72819a;background:#26354d;color:#fff;padding:9px 15px;border-radius:10px;font:inherit;cursor:pointer}.toggle[aria-pressed=true]{background:#425c55;border-color:#87cdb0}.status{min-width:110px;text-align:center}@media(max-height:540px){header{padding:4px 0}h1{font-size:25px}p{font-size:12px}main{gap:8px;padding:6px 0}.pad{border-radius:13px;gap:2px}.symbol{font-size:34px}.name{font-size:22px}.hint{font-size:11px}footer{padding-bottom:5px}}
</style></head><body><header><h1>✦ The Silent Conductor ✦</h1><p>Tap to play · Hold Violin or Flute to sustain · Play two at once</p></header><main><button class="pad drum" data-inst="drum" aria-label="Play drum"><span class="symbol">●</span><span class="name">DRUM</span><span class="hint">Percussion</span></button><button class="pad harp" data-inst="harp" aria-label="Play harp"><span class="symbol">△</span><span class="name">HARP</span><span class="hint">Plucked strings</span></button><button class="pad violin" data-inst="violin" aria-label="Play violin"><span class="symbol">≋</span><span class="name">VIOLIN</span><span class="hint">Hold to sustain</span></button><button class="pad flute" data-inst="flute" aria-label="Play flute"><span class="symbol">◌</span><span class="name">FLUTE</span><span class="hint">Hold to sustain</span></button></main><footer><button id="sustain" class="toggle" aria-pressed="false">Sustain mode: OFF</button><span id="status" class="status" role="status">Ready to play</span><button id="stop" class="toggle">Stop all</button></footer><script>
(()=>{'use strict';let ctx,master,noiseBuffer;const active=new Map();const pads=[...document.querySelectorAll('.pad')];const status=document.getElementById('status');let sustain=false;
function init(){if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();master=ctx.createGain();master.gain.value=.68;master.connect(ctx.destination);noiseBuffer=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);let a=noiseBuffer.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}if(ctx.state==='suspended')ctx.resume();}
function osc(type,freq,dest,t,vol=1,detune=0){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.detune.value=detune;g.gain.value=vol;o.connect(g).connect(dest);o.start(t);return {o,g};}
function env(g,t,peak,attack,decay,end){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,peak),t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+decay);g.o?.stop(t+end);}
function drum(){const t=ctx.currentTime,b=ctx.createGain();b.connect(master);b.gain.setValueAtTime(.9,t);b.gain.exponentialRampToValueAtTime(.0001,t+.38);const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(155,t);o.frequency.exponentialRampToValueAtTime(49,t+.24);o.connect(b);o.start(t);o.stop(t+.39);const src=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=noiseBuffer;hp.type='highpass';hp.frequency.value=800;g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.075);src.connect(hp).connect(g).connect(master);src.start(t);src.stop(t+.08);}
function harp(){const t=ctx.currentTime;[392,523.25,659.25].forEach((f,i)=>{const delay=i*.038;[1,2,3].forEach((h)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f*h;g.gain.setValueAtTime(.0001,t+delay);g.gain.exponentialRampToValueAtTime(.18/h,t+delay+.008);g.gain.exponentialRampToValueAtTime(.0001,t+delay+1.65/h);o.connect(g).connect(master);o.start(t+delay);o.stop(t+delay+1.8);});});}
function sustained(inst){const t=ctx.currentTime,output=ctx.createGain();output.gain.setValueAtTime(.0001,t);output.gain.linearRampToValueAtTime(inst==='violin'?.29:.31,t+(inst==='violin'?.22:.09));output.connect(master);let nodes=[];if(inst==='violin'){[1,2,3,4].forEach((h)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type=h===1?'sawtooth':'sine';o.frequency.value=440*h;o.detune.value=h%2?2:-3;g.gain.value=[.45,.17,.10,.045][h-1];o.connect(g).connect(output);o.start(t);nodes.push(o);});}else{[1,2,3].forEach((h)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=587.33*h;g.gain.value=[.72,.11,.035][h-1];o.connect(g).connect(output);o.start(t);nodes.push(o);});}return ()=>{const now=ctx.currentTime;output.gain.cancelScheduledValues(now);output.gain.setValueAtTime(Math.max(.0001,output.gain.value),now);output.gain.exponentialRampToValueAtTime(.0001,now+.2);nodes.forEach(o=>{try{o.stop(now+.23)}catch(e){}});};}
function start(p,e){e.preventDefault();init();const inst=p.dataset.inst,id=e.pointerId;p.setPointerCapture?.(id);p.classList.add('active');let stop=()=>{};if(inst==='drum')drum();else if(inst==='harp')harp();else stop=sustained(inst);active.set(id,{p,stop,inst});status.textContent=inst[0].toUpperCase()+inst.slice(1)+' playing';if(inst==='drum'||inst==='harp')setTimeout(()=>{if(active.get(id)?.p===p)p.classList.remove('active')},240);}
function end(e){const a=active.get(e.pointerId);if(!a)return;if(!sustain||a.inst==='drum'||a.inst==='harp'){a.stop();a.p.classList.remove('active');active.delete(e.pointerId);}status.textContent=active.size?'Playing':'Ready to play';}
function stopAll(){active.forEach(a=>{a.stop();a.p.classList.remove('active')});active.clear();status.textContent='Stopped';}
pads.forEach(p=>{p.addEventListener('pointerdown',e=>start(p,e));p.addEventListener('pointerup',end);p.addEventListener('pointercancel',end);p.addEventListener('contextmenu',e=>e.preventDefault());});document.getElementById('sustain').addEventListener('click',e=>{sustain=!sustain;e.currentTarget.setAttribute('aria-pressed',String(sustain));e.currentTarget.textContent='Sustain mode: '+(sustain?'ON':'OFF');if(!sustain)stopAll();});document.getElementById('stop').addEventListener('click',stopAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll()});})();
</script></body></html>
